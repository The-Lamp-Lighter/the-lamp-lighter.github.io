<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal — Lunarium's Lab</title>
<link rel="icon" href="assets/favicon.png">
<script src="js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=VT323&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Space+Mono&family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/base.css">
<style>
  .term-window {
    background: var(--surface-strong); border:1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow:hidden; height: calc(100vh - 190px); min-height: 420px;
    display:flex; flex-direction:column;
  }
  .term-titlebar { display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--border); }
  .term-dot { width:11px; height:11px; border-radius:50%; }
  .term-titlebar span.dim { margin-left:8px; font-family:var(--font-mono); font-size:.75rem; }
  .term-output {
    flex:1; overflow-y:auto; padding:16px 18px; font-family:var(--font-mono); font-size:.86rem;
  }
  .term-line { margin-bottom: 6px; white-space: pre-wrap; word-break: break-word; }
  .term-echo { color: var(--text-strong); }
  .term-err { color: #ff8a8a; }
  .term-prompt { color: hsl(var(--accent-h) var(--accent-s) var(--accent-l)); }
  .term-banner { margin:0 0 10px 0; color: var(--text-dim); font-family:var(--font-mono); }
  .term-help { display:flex; flex-direction:column; gap:3px; }
  .term-help-row { display:flex; gap:12px; }
  .term-help-row span:first-child { min-width: 90px; }
  .term-inputrow {
    display:flex; align-items:center; gap:8px; padding:12px 18px; border-top:1px solid var(--border);
    font-family: var(--font-mono); font-size:.86rem;
  }
  .term-inputrow input {
    background:none; border:none; outline:none; flex:1; color:var(--text-strong); font-family:inherit; font-size:inherit; padding:0;
  }
</style>
</head>
<body data-page="terminal">
  <div id="app-shell">
    <div id="app-nav"></div>
    <div>
      <header class="topbar" id="app-topbar"></header>
      <main id="app-main">
        <div class="term-window">
          <div class="term-titlebar">
            <span class="term-dot" style="background:#ff5f57;"></span>
            <span class="term-dot" style="background:#febc2e;"></span>
            <span class="term-dot" style="background:#28c840;"></span>
            <span class="dim">Terminal</span>
          </div>
          <div class="term-output" id="term-output"></div>
          <div class="term-inputrow">
            <span class="term-prompt">~$</span>
            <input type="text" id="term-input" autocomplete="off" spellcheck="false" aria-label="Comando do terminal">
          </div>
        </div>
      </main>
    </div>
  </div>
  <div id="theme-panel-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="data/projects.js"></script>
  <script src="js/news.js"></script>
  <script src="js/terminal.js"></script>
  <script>window.LunariumTerminal.init("term-output", "term-input");</script>
</body>
</html>
