<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luna DAW — Lunarium's Lab</title>
<link rel="icon" href="assets/favicon.png">
<script src="js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=VT323&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Space+Mono&family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/base.css">
<style>
  #app-main { max-width: none; padding: 20px 24px; }
  body { --bar-w: 56px; }
  .daw-shell { display:flex; flex-direction:column; gap:12px; height: calc(100vh - 110px); }

  .daw-toolbar {
    display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:12px 16px;
  }
  .daw-toolbar input[type="text"] { width:180px; }
  .daw-transport { display:flex; align-items:center; gap:8px; }
  .daw-transport button { width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; }
  .daw-transport button.play { background: hsl(var(--accent-h) var(--accent-s) var(--accent-l)); color: var(--on-accent); border:none; }
  .bpm-field { display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:.8rem; }
  .bpm-field input { width:60px; padding:.4em .5em; text-align:center; }
  .daw-toolbar .spacer { flex:1; }
  .daw-toolbar select { width:auto; padding:.5em .8em; font-size:.8rem; }

  .daw-body { flex:1; display:grid; grid-template-columns: 230px 1fr; gap:12px; min-height:0; }
  .track-panel { display:flex; flex-direction:column; overflow:hidden; }
  .track-panel-head { padding:12px 14px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  .track-list { overflow-y:auto; flex:1; }
  .track-row { padding:10px 12px; border-bottom:1px solid var(--border); cursor:pointer; border-left:3px solid transparent; }
  .track-row.active { background: hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .12); border-left-color: hsl(var(--accent-h) var(--accent-s) var(--accent-l)); }
  .track-row-top { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .track-row input[type="text"] { background:none; border:none; padding:2px 0; font-size:.82rem; color:var(--text-strong); font-family:var(--font-body); width:100%; }
  .track-row-controls { display:flex; align-items:center; gap:4px; }
  .track-mini-btn { width:22px; height:22px; border-radius:4px; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); font-size:.65rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .track-mini-btn.on-mute { background:#ff5a5a; color:#fff; border-color:transparent; }
  .track-mini-btn.on-solo { background:#ffb020; color:#1a1200; border-color:transparent; }
  .track-row select { font-size:.7rem; padding:.3em .4em; margin-bottom:6px; }
  .track-row input[type="range"] { width:100%; }

  .roll-panel { display:flex; flex-direction:column; overflow:hidden; }
  .roll-scroll { flex:1; overflow:auto; position:relative; }
  .roll-grid { position:relative; }
  .roll-row-label {
    position:sticky; left:0; z-index:3; width:64px; box-sizing:border-box;
    display:flex; align-items:center; justify-content:flex-end; padding-right:8px;
    font-size:.62rem; font-family:var(--font-mono); color:var(--text-faint); background:var(--surface-strong);
    border-bottom:1px solid var(--border); border-right:1px solid var(--border);
  }
  .roll-row-label.black { color: var(--text-dim); }
  .roll-cellrow { position:relative; }
  .note-block {
    position:absolute; top:1px; bottom:1px; border-radius:3px;
    background: hsl(var(--accent-h) var(--accent-s) var(--accent-l));
    box-shadow: 0 0 6px hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .5);
    cursor:pointer;
  }
  .playhead {
    position:absolute; top:0; bottom:0; width:2px; background:#fff; opacity:.85; pointer-events:none; z-index:4;
    box-shadow: 0 0 6px #fff;
  }
  .empty-state.small { padding: 40px 16px; }

  .roll-editbar { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .roll-editbar strong { font-size:.85rem; }

  /* ---- timeline (blocos) ---- */
  .tl-scroll { flex:1; overflow:auto; position:relative; }
  .tl-ruler { position:sticky; top:0; z-index:3; display:flex; background:var(--surface-strong); border-bottom:1px solid var(--border); }
  .tl-ruler span {
    flex-shrink:0; font-family:var(--font-mono); font-size:.62rem; color:var(--text-faint);
    border-right:1px solid var(--border); padding:4px 0 4px 4px; box-sizing:border-box;
  }
  .tl-track-row { display:flex; height:56px; border-bottom:1px solid var(--border); }
  .tl-lane {
    position:relative; flex-shrink:0; height:100%;
    background-image:
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0, rgba(255,255,255,.05) 1px, transparent 1px, transparent var(--bar-w)),
      repeating-linear-gradient(90deg, var(--border) 0, var(--border) 1px, transparent 1px, transparent calc(var(--bar-w) * 4));
  }
  .tl-clip {
    position:absolute; top:6px; bottom:6px; border-radius:5px; cursor:grab;
    background: hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .28);
    border:1px solid hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .7);
    overflow:hidden; user-select:none; touch-action:none;
  }
  .tl-clip.selected { box-shadow: 0 0 0 2px hsl(var(--accent-h) var(--accent-s) var(--accent-l)); }
  .tl-clip-repeats { position:absolute; inset:0; display:flex; }
  .tl-clip-repeats span { flex-shrink:0; border-right:1px dashed hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .4); height:100%; }
  .tl-clip-label { position:relative; z-index:1; font-size:.65rem; padding:3px 6px; color:var(--text-strong); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tl-clip-resize { position:absolute; right:0; top:0; bottom:0; width:8px; cursor:ew-resize; }
  .tl-clip-toolbar {
    position:absolute; z-index:10; display:flex; gap:4px; background:var(--surface-strong); border:1px solid var(--border);
    border-radius:6px; padding:3px; box-shadow: var(--shadow);
  }
  .tl-clip-toolbar button { width:24px; height:24px; border-radius:4px; border:none; background:none; color:var(--text); cursor:pointer; }
  .tl-clip-toolbar button:hover { background: var(--surface); }

  .icon-picker-overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:80; display:flex; align-items:center; justify-content:center; padding:20px; }
  .icon-picker-card { width:100%; max-width:380px; max-height:70vh; overflow-y:auto; padding:20px; }
  .icon-picker-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap:6px; margin-top:12px; }
  .icon-picker-grid button { aspect-ratio:1; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:1rem; cursor:pointer; }
  .icon-picker-grid button:hover, .icon-picker-grid button.active { border-color: hsl(var(--accent-h) var(--accent-s) var(--accent-l)); color: hsl(var(--accent-h) var(--accent-s) var(--accent-l)); }
</style>
</head>
<body data-page="daw">
  <div id="app-shell">
    <div id="app-nav"></div>
    <div>
      <header class="topbar" id="app-topbar"></header>
      <main id="app-main">
        <div class="daw-shell">
          <div class="panel daw-toolbar">
            <div class="daw-transport">
              <button class="play" id="btn-play" aria-label="Tocar/Parar"><i class="fa-solid fa-play" id="play-icon"></i></button>
              <button id="btn-stop" aria-label="Parar e voltar ao início"><i class="fa-solid fa-stop"></i></button>
            </div>
            <div class="bpm-field"><i class="fa-solid fa-gauge-high dim"></i><input type="number" id="bpm-input" min="40" max="240" value="100"> BPM</div>
            <label class="dim" style="display:flex;align-items:center;gap:6px;font-size:.78rem;"><input type="checkbox" id="loop-toggle" checked style="width:auto;"> loop</label>
            <button class="btn-icon btn-ghost" id="icon-picker-btn" style="font-size:1rem;" title="Escolher ícone do projeto"><i class="fa-solid fa-music" id="icon-picker-preview"></i></button>
            <input type="text" id="project-name" value="Sem título">
            <button class="btn btn-ghost" id="btn-download" style="font-size:.78rem;" title="Baixar áudio (WAV)"><i class="fa-solid fa-download"></i></button>
            <div class="spacer"></div>
            <select id="load-select"><option value="">Meus projetos…</option></select>
            <button class="btn btn-ghost" id="btn-new" style="font-size:.78rem;"><i class="fa-solid fa-file"></i> Novo</button>
            <button class="btn btn-solid" id="btn-save" style="font-size:.78rem;"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
          </div>

          <div class="daw-body">
            <aside class="panel track-panel">
              <div class="track-panel-head">
                <strong style="font-size:.85rem;">Faixas</strong>
                <select id="new-track-preset" style="font-size:.7rem;padding:.3em .4em;"></select>
              </div>
              <div class="track-list" id="track-list"></div>
              <div style="padding:10px;"><button class="btn btn-ghost" id="btn-add-track" style="width:100%;justify-content:center;font-size:.78rem;"><i class="fa-solid fa-plus"></i> Adicionar faixa</button></div>
            </aside>

            <section class="panel roll-panel" id="workspace">
              <!-- visão Timeline (blocos) -->
              <div id="view-timeline">
                <div class="tl-scroll" id="tl-scroll">
                  <div id="tl-ruler-wrap"></div>
                  <div id="tl-rows"></div>
                </div>
              </div>
              <!-- visão Piano Roll (edição de um bloco) -->
              <div id="view-roll" class="hidden" style="display:flex;flex-direction:column;height:100%;">
                <div class="roll-editbar">
                  <button class="btn btn-ghost" id="btn-back-timeline" style="font-size:.76rem;"><i class="fa-solid fa-arrow-left"></i> Linha do tempo</button>
                  <strong id="roll-editbar-title">—</strong>
                  <div class="spacer" style="flex:1;"></div>
                  <button class="btn-icon btn-ghost" id="btn-delete-clip" title="Excluir bloco"><i class="fa-solid fa-trash"></i></button>
                </div>
                <div class="roll-scroll" id="roll-scroll" style="flex:1;">
                  <div class="roll-grid" id="roll-grid"></div>
                </div>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div id="icon-picker-root"></div>
  <div id="theme-panel-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/daw-audio.js"></script>
  <script src="js/daw-engine.js"></script>
</body>
</html>
