<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil — Lunarium's Lab</title>
<link rel="icon" href="assets/favicon.png">
<script src="js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=VT323&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Space+Mono&family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/base.css">
<style>
  .profile-card { max-width: 520px; padding: 28px; }
  .avatar-row { display:flex; align-items:center; gap:18px; margin-bottom:24px; }
  .avatar-big {
    width:84px; height:84px; border-radius:50%; overflow:hidden; flex-shrink:0;
    background: hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .2);
    display:flex; align-items:center; justify-content:center; font-size:1.8rem; color:var(--text-strong);
  }
  .avatar-big img { width:100%; height:100%; object-fit:cover; }
  .code-box {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background: var(--input-bg); border:1px solid var(--border); border-radius: var(--radius-sm);
    padding: .7em .9em; font-family: var(--font-mono); font-size:.85rem; margin-bottom:20px;
  }
  #save-msg { font-size:.8rem; margin-top:10px; }
  #save-msg.ok { color: #6ee0a0; }
  #save-msg.err { color: #ff8a8a; }

  .projects-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:14px; }
  .project-card { padding:18px; display:flex; flex-direction:column; gap:10px; }
  .project-card .picon {
    width:42px; height:42px; border-radius: var(--radius-sm); display:flex; align-items:center; justify-content:center;
    font-size:1.2rem; background: hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .18);
    color: hsl(var(--accent-h) var(--accent-s) calc(var(--accent-l) + 10%));
  }
  .project-card .pname { font-size:1rem; font-weight:600; color:var(--text-strong); word-break:break-word; }
  .project-card .pmeta { font-size:.72rem; color:var(--text-faint); font-family:var(--font-mono); }
  .project-card .pactions { display:flex; gap:8px; margin-top:auto; }
  .project-card .pactions .btn { flex:1; justify-content:center; font-size:.74rem; padding:.5em; }
</style>
</head>
<body data-page="profile">
  <div id="app-shell">
    <div id="app-nav"></div>
    <div>
      <header class="topbar" id="app-topbar"></header>
      <main id="app-main">
        <div class="panel profile-card">
          <div class="avatar-row">
            <div class="avatar-big" id="avatar-preview">?</div>
            <div>
              <input type="file" id="avatar-input" accept="image/*" class="hidden">
              <button class="btn btn-ghost" id="avatar-btn" type="button"><i class="fa-solid fa-camera"></i> Trocar foto</button>
              <p class="dim" style="font-size:.72rem;margin-top:6px;">JPG ou PNG, até 3MB.</p>
            </div>
          </div>

          <p class="dim" style="font-size:.75rem;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;">Seu código de chat</p>
          <div class="code-box">
            <span id="chat-code">—</span>
            <button class="btn-icon btn-ghost" id="copy-code-btn" aria-label="Copiar"><i class="fa-regular fa-copy"></i></button>
          </div>

          <form id="profile-form">
            <div class="field">
              <label for="display-name">Nome de exibição</label>
              <input type="text" id="display-name" maxlength="40">
            </div>
            <div class="field">
              <label for="bio">Bio</label>
              <input type="text" id="bio" maxlength="140" placeholder="Uma frase sobre você">
            </div>
            <button type="submit" class="btn btn-solid" style="width:100%;justify-content:center;padding:.8em;">
              <i class="fa-solid fa-floppy-disk"></i> Salvar alterações
            </button>
            <p id="save-msg" class="hidden"></p>
          </form>
        </div>

        <div style="max-width:820px;margin-top:28px;">
          <p class="dim" style="font-size:.78rem;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;">
            <i class="fa-solid fa-moon"></i> Meus projetos — Luna DAW
          </p>
          <div class="projects-grid" id="projects-grid"><div class="empty-state small"><div class="orbit"></div><h3>Carregando…</h3></div></div>
        </div>
      </main>
    </div>
  </div>
  <div id="theme-panel-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/daw-audio.js"></script>
  <script>
    (function () {
      var profile = null;

      function paintAvatar(url, fallbackInitials) {
        var el = document.getElementById("avatar-preview");
        el.innerHTML = url ? '<img src="' + url + '" alt="">' : fallbackInitials;
      }

      window.LunariumAuth.getProfile().then(function (p) {
        if (!p) return;
        profile = p;
        var name = p.display_name || p.username;
        paintAvatar(p.avatar_url, name.slice(0, 2).toUpperCase());
        document.getElementById("chat-code").textContent = p.chat_code;
        document.getElementById("display-name").value = p.display_name || "";
        document.getElementById("bio").value = p.bio || "";
      });

      document.getElementById("copy-code-btn").addEventListener("click", function () {
        if (!profile) return;
        navigator.clipboard && navigator.clipboard.writeText(profile.chat_code);
        var el = document.getElementById("copy-code-btn");
        el.innerHTML = '<i class="fa-solid fa-check"></i>';
        setTimeout(function () { el.innerHTML = '<i class="fa-regular fa-copy"></i>'; }, 1200);
      });

      document.getElementById("avatar-btn").addEventListener("click", function () {
        document.getElementById("avatar-input").click();
      });

      document.getElementById("avatar-input").addEventListener("change", function (e) {
        var file = e.target.files[0];
        if (!file || !profile) return;
        if (file.size > 3 * 1024 * 1024) { alert("Arquivo maior que 3MB."); return; }
        var ext = file.name.split(".").pop();
        var path = profile.id + "/avatar." + ext;

        window.sb.storage.from("avatars").upload(path, file, { upsert: true }).then(function (res) {
          if (res.error) throw res.error;
          var pub = window.sb.storage.from("avatars").getPublicUrl(path);
          var url = pub.data.publicUrl + "?t=" + Date.now();
          return window.LunariumAuth.updateProfile({ avatar_url: url });
        }).then(function (updated) {
          profile = updated;
          paintAvatar(updated.avatar_url, null);
          document.dispatchEvent(new CustomEvent("lunarium:profile-updated"));
        }).catch(function (err) {
          alert("Não deu pra enviar a imagem: " + (err.message || err));
        });
      });

      document.getElementById("profile-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var msg = document.getElementById("save-msg");
        window.LunariumAuth.updateProfile({
          display_name: document.getElementById("display-name").value.trim(),
          bio: document.getElementById("bio").value.trim()
        }).then(function (updated) {
          profile = updated;
          msg.textContent = "salvo!";
          msg.className = "ok";
        }).catch(function (err) {
          msg.textContent = "erro ao salvar: " + (err.message || err);
          msg.className = "err";
        });
      });

      function escapeHtml(str) { var d = document.createElement("div"); d.textContent = str || ""; return d.innerHTML; }

      function loadProjects() {
        window.LunariumAuth.getSession().then(function (session) {
          if (!session) return;
          return window.sb.from("daw_projects").select("*").eq("owner_id", session.user.id).order("updated_at", { ascending: false });
        }).then(function (res) {
          if (!res) return;
          var grid = document.getElementById("projects-grid");
          if (res.error) { grid.innerHTML = '<p class="dim">não deu pra carregar: ' + escapeHtml(res.error.message) + '</p>'; return; }
          if (!res.data.length) {
            grid.innerHTML = '<div class="empty-state small"><div class="orbit"></div><h3>Nenhum projeto ainda</h3><p class="dim">Crie um na <a class="accent" href="daw.html">Luna DAW</a>.</p></div>';
            return;
          }
          grid.innerHTML = res.data.map(function (p) {
            var trackCount = (p.data && p.data.tracks) ? p.data.tracks.length : 0;
            var when = new Date(p.updated_at).toLocaleDateString("pt-BR");
            return (
              '<div class="panel project-card">' +
                '<span class="picon"><i class="' + (p.icon || "fa-solid fa-music") + '"></i></span>' +
                '<span class="pname">' + escapeHtml(p.name) + '</span>' +
                '<span class="pmeta">' + trackCount + ' faixa(s) · ' + when + '</span>' +
                '<div class="pactions">' +
                  '<a class="btn btn-ghost" href="daw.html?load=' + p.id + '"><i class="fa-solid fa-pen"></i> Abrir</a>' +
                  '<button class="btn btn-solid" data-download="' + p.id + '"><i class="fa-solid fa-download"></i></button>' +
                '</div>' +
              '</div>'
            );
          }).join("");

          grid.querySelectorAll("[data-download]").forEach(function (btn) {
            btn.addEventListener("click", function () {
              var proj = res.data.filter(function (p) { return p.id === btn.dataset.download; })[0];
              if (!proj) return;
              btn.disabled = true;
              btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
              window.LunariumDawAudio.renderProjectToWav(proj.data).then(function (blob) {
                window.LunariumDawAudio.triggerDownload(blob, proj.name.replace(/[^\w\-]+/g, "_") + ".wav");
              }).catch(function (err) {
                alert("não deu pra exportar: " + (err.message || err));
              }).then(function () {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-download"></i>';
              });
            });
          });
        });
      }
      loadProjects();
    })();
  </script>
</body>
</html>
