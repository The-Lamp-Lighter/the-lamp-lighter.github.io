<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cantinho — Lunarium's Lab</title>
<link rel="icon" href="assets/favicon.png">
<script src="js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=VT323&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Space+Mono&family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/base.css">
<style>
  .cantinho-split { display:grid; grid-template-columns: 1.6fr 1fr; gap:20px; align-items:start; }
  @media (max-width: 900px) { .cantinho-split { grid-template-columns:1fr; } }

  .section-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap; }
  .section-head h2 { font-size:1rem; margin:0; }

  .works-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:16px; }
  .work-tile {
    position:relative; border-radius: var(--radius-sm); overflow:hidden; cursor:pointer;
    border:1px solid var(--border); background:var(--surface);
    transition: transform .2s ease, box-shadow .2s ease; aspect-ratio: 4/3;
  }
  .work-tile:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
  .work-tile img { width:100%; height:100%; object-fit:cover; display:block; }
  .work-tile-empty { width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:2rem; background:var(--surface-strong); }
  .work-tile-overlay {
    position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.8) 0%, rgba(0,0,0,0) 60%);
    display:flex; align-items:flex-end; padding:12px; opacity:0; transition:opacity .2s ease;
  }
  .work-tile:hover .work-tile-overlay { opacity:1; }
  .work-tile-overlay strong { color:#fff; font-size:.88rem; display:block; }
  .work-tile-overlay small { color:rgba(255,255,255,.7); font-size:.7rem; }
  .work-tile-draft { position:absolute; top:8px; left:8px; }
  .work-tile-admin { position:absolute; top:8px; right:8px; display:flex; gap:6px; opacity:0; transition:opacity .2s ease; }
  .work-tile:hover .work-tile-admin { opacity:1; }
  .work-tile-admin button { width:30px; height:30px; border-radius:50%; border:none; background:rgba(10,10,14,.7); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .work-tile-admin button:hover { background:rgba(10,10,14,.9); }

  /* visualizador em tela cheia, estilo ArtStation */
  .lightbox-overlay { position:fixed; inset:0; background:rgba(6,5,10,.94); z-index:95; display:flex; flex-direction:column; }
  .lightbox-topbar { display:flex; justify-content:flex-end; padding:14px 18px; flex-shrink:0; }
  .lightbox-close { width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); color:#fff; cursor:pointer; font-size:1rem; }
  .lightbox-close:hover { background:rgba(255,255,255,.18); }
  .lightbox-body { flex:1; display:grid; grid-template-columns: 1fr 340px; overflow:hidden; min-height:0; }
  @media (max-width: 860px) { .lightbox-body { grid-template-columns:1fr; overflow-y:auto; } }
  .lightbox-viewer { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; min-height:0; overflow:hidden; }
  .lightbox-frame { flex:1; width:100%; display:flex; align-items:center; justify-content:center; min-height:0; }
  .lightbox-frame img, .lightbox-frame video { max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; }
  .lightbox-frame iframe { width:100%; height:100%; min-height:320px; border:none; border-radius:8px; }
  .lightbox-nav-btn {
    position:absolute; top:50%; translate:0 -50%; width:44px; height:44px; border-radius:50%;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); color:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1.1rem; z-index:2;
  }
  .lightbox-nav-btn:hover { background:rgba(255,255,255,.18); }
  .lightbox-nav-btn.prev { left:12px; } .lightbox-nav-btn.next { right:12px; }
  .lightbox-thumbs { display:flex; gap:8px; margin-top:14px; overflow-x:auto; max-width:100%; padding:2px; flex-shrink:0; }
  .lightbox-thumb { width:64px; height:48px; object-fit:cover; border-radius:4px; cursor:pointer; border:2px solid transparent; opacity:.55; flex-shrink:0; transition: opacity .15s ease, border-color .15s ease; }
  .lightbox-thumb.active { opacity:1; border-color: hsl(var(--accent-h) var(--accent-s) var(--accent-l)); }
  .lightbox-thumb-sketchfab { width:64px; height:48px; border-radius:4px; cursor:pointer; flex-shrink:0; background:var(--surface); border:2px solid transparent; display:flex; align-items:center; justify-content:center; color:var(--text-dim); opacity:.55; }
  .lightbox-thumb-sketchfab.active { opacity:1; border-color: hsl(var(--accent-h) var(--accent-s) var(--accent-l)); color:var(--text-strong); }
  .lightbox-sidebar { background: var(--surface-strong); padding:28px; overflow-y:auto; border-left:1px solid var(--border); }
  .lightbox-sidebar h2 { font-size:1.25rem; margin-bottom:6px; }
  .lightbox-sidebar .dim { font-size:.78rem; }
  .lightbox-desc { font-size:.86rem; color:var(--text-dim); white-space:pre-wrap; margin:16px 0; line-height:1.6; }
  .lightbox-admin-row { display:flex; gap:8px; margin-top:20px; padding-top:20px; border-top:1px solid var(--border); }
  .work-tools { display:flex; flex-wrap:wrap; gap:4px; margin:12px 0; }

  .link-card {
    display:flex; align-items:center; gap:12px; padding:14px 16px; text-decoration:none; color:var(--text);
    border-radius: var(--radius-sm); border:1px solid var(--border); background:var(--surface); margin-bottom:10px;
    transition: transform .15s ease, border-color .15s ease;
  }
  .link-card:hover { transform: translateX(4px); border-color: hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .5); }
  .link-card i { width:20px; text-align:center; color: hsl(var(--accent-h) var(--accent-s) var(--accent-l)); }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:85; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal-card { width:100%; max-width:560px; max-height:88vh; overflow-y:auto; padding:26px; }
  .file-drop {
    border:1.5px dashed var(--border); border-radius: var(--radius-sm); padding:22px; text-align:center;
    cursor:pointer; color:var(--text-dim); font-size:.85rem; margin-bottom:16px;
  }
  .file-drop:hover { border-color: hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .5); }
  .file-preview-list { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .file-preview-list span { font-size:.7rem; background:var(--input-bg); padding:4px 8px; border-radius:6px; }
</style>
</head>
<body data-page="cantinho">
  <div id="app-shell">
    <div id="app-nav"></div>
    <div>
      <header class="topbar" id="app-topbar"></header>
      <main id="app-main">
        <div class="cantinho-split">
          <section>
            <div class="section-head">
              <h2><i class="fa-solid fa-cubes accent"></i> Meus Trabalhos</h2>
              <button class="btn btn-solid hidden" id="new-work-btn" type="button" style="font-size:.78rem;">
                <i class="fa-solid fa-plus"></i> Novo trabalho
              </button>
            </div>
            <div id="works-list" class="works-grid"><div class="empty-state" style="grid-column:1/-1;"><div class="orbit"></div><h3>Carregando…</h3></div></div>
          </section>

          <section>
            <div class="panel" style="padding:18px;">
              <h2 style="font-size:.95rem;margin:0 0 12px 0;"><i class="fa-solid fa-link accent"></i> Minhas redes sociais</h2>
              <div id="links-list"></div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <div id="lightbox-root"></div>
  <div id="modal-root"></div>
  <div id="theme-panel-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="data/cantinho.js"></script>
  <script>
  (function () {
    function escapeHtml(str) { var d = document.createElement("div"); d.textContent = str || ""; return d.innerHTML; }
    var isAdmin = false;
    var pendingFiles = [];

    var links = window.LUNARIUM_CANTINHO_LINKS || [];
    document.getElementById("links-list").innerHTML = links.map(function (l) {
      return '<a class="link-card" href="' + l.url + '" target="_blank" rel="noopener"><i class="' + l.icon + '"></i>' + escapeHtml(l.label) + '</a>';
    }).join("") || '<p class="dim" style="font-size:.82rem;">Nenhum link cadastrado ainda.</p>';

    var worksCache = [];
    var lightboxState = { work: null, media: [], index: 0 };

    function getMediaList(w) {
      var list = (w.work_media || []).slice().sort(function (a, b) { return a.position - b.position; })
        .map(function (m) { return { type: m.media_type, url: m.url }; });
      if (w.sketchfab_embed_url) list.unshift({ type: "sketchfab", url: w.sketchfab_embed_url });
      return list;
    }

    function renderWorkTile(w) {
      var media = getMediaList(w);
      var cover = media.find(function (m) { return m.type === "image"; }) || media.find(function (m) { return m.type === "video"; });
      var coverHtml = cover
        ? (cover.type === "video" ? '<video src="' + cover.url + '" muted></video>' : '<img src="' + cover.url + '" alt="" loading="lazy">')
        : '<div class="work-tile-empty"><i class="fa-solid fa-cubes"></i></div>';
      var adminHtml = isAdmin
        ? '<div class="work-tile-admin">' +
            '<button data-toggle-pub="' + w.id + '" data-current="' + w.published + '" title="' + (w.published ? "Despublicar" : "Publicar") + '"><i class="fa-solid ' + (w.published ? "fa-eye" : "fa-eye-slash") + '"></i></button>' +
            '<button data-delete="' + w.id + '" title="Excluir"><i class="fa-solid fa-trash"></i></button>' +
          '</div>'
        : "";
      var draftHtml = !w.published ? '<span class="tag work-tile-draft" style="background:rgba(255,150,60,.85);color:#241200;">rascunho</span>' : "";
      return (
        '<div class="work-tile" data-open="' + w.id + '">' +
          coverHtml + draftHtml + adminHtml +
          '<div class="work-tile-overlay"><div><strong>' + escapeHtml(w.title) + '</strong><small>' + new Date(w.created_at).toLocaleDateString("pt-BR") + '</small></div></div>' +
        '</div>'
      );
    }

    function loadWorks() {
      return window.sb.from("works")
        .select("*, work_media(*)")
        .order("created_at", { ascending: false })
        .then(function (res) {
          if (res.error) throw res.error;
          worksCache = res.data || [];
          var list = document.getElementById("works-list");
          if (!worksCache.length) {
            list.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="orbit"></div><h3>Nenhum trabalho publicado ainda</h3>' +
              (isAdmin ? '<p class="dim">Clique em "Novo trabalho" pra começar.</p>' : '') + '</div>';
            return;
          }
          list.innerHTML = worksCache.map(renderWorkTile).join("");
          bindWorkActions();
        }).catch(function (err) {
          document.getElementById("works-list").innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="orbit"></div><h3>Não deu pra carregar</h3><p class="dim">' + escapeHtml(err.message || "erro desconhecido") + '</p></div>';
        });
    }

    function bindWorkActions() {
      document.querySelectorAll("[data-open]").forEach(function (tile) {
        tile.addEventListener("click", function (e) {
          if (e.target.closest("[data-toggle-pub], [data-delete]")) return;
          openLightbox(tile.dataset.open);
        });
      });
      document.querySelectorAll("[data-toggle-pub]").forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          togglePublished(btn.dataset.togglePub, btn.dataset.current === "true");
        });
      });
      document.querySelectorAll("[data-delete]").forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          deleteWork(btn.dataset.delete);
        });
      });
    }

    function togglePublished(id, current) {
      window.sb.from("works").update({ published: !current }).eq("id", id).then(function (res) {
        if (res.error) { alert(res.error.message); return; }
        loadWorks();
      });
    }

    function deleteWork(id) {
      if (!confirm("Excluir este trabalho? Isso não pode ser desfeito.")) return;
      window.sb.from("works").delete().eq("id", id).then(function (res) {
        if (res.error) { alert(res.error.message); return; }
        closeLightbox();
        loadWorks();
      });
    }

    // ---------- visualizador em tela cheia (estilo ArtStation) ----------
    function openLightbox(workId) {
      var w = worksCache.find(function (x) { return x.id === workId; });
      if (!w) return;
      lightboxState = { work: w, media: getMediaList(w), index: 0 };
      var root = document.getElementById("lightbox-root");
      root.innerHTML =
        '<div class="lightbox-overlay" id="lightbox-overlay">' +
          '<div class="lightbox-topbar"><button class="lightbox-close" id="lightbox-close"><i class="fa-solid fa-xmark"></i></button></div>' +
          '<div class="lightbox-body">' +
            '<div class="lightbox-viewer">' +
              '<div class="lightbox-frame" id="lightbox-frame"></div>' +
              '<div class="lightbox-thumbs" id="lightbox-thumbs"></div>' +
            '</div>' +
            '<div class="lightbox-sidebar" id="lightbox-sidebar"></div>' +
          '</div>' +
        '</div>';

      document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
      document.getElementById("lightbox-overlay").addEventListener("click", function (e) {
        if (e.target.id === "lightbox-overlay") closeLightbox();
      });
      document.addEventListener("keydown", lightboxKeyHandler);

      renderLightboxFrame();
      renderLightboxThumbs();
      renderLightboxSidebar();
    }

    function lightboxKeyHandler(e) {
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowRight") stepLightbox(1);
      if (e.key === "ArrowLeft") stepLightbox(-1);
    }

    function closeLightbox() {
      document.getElementById("lightbox-root").innerHTML = "";
      document.removeEventListener("keydown", lightboxKeyHandler);
    }

    function stepLightbox(delta) {
      var n = lightboxState.media.length;
      if (n < 2) return;
      lightboxState.index = (lightboxState.index + delta + n) % n;
      renderLightboxFrame();
      renderLightboxThumbs();
    }

    function renderLightboxFrame() {
      var frame = document.getElementById("lightbox-frame");
      var m = lightboxState.media[lightboxState.index];
      var navHtml = lightboxState.media.length > 1
        ? '<button class="lightbox-nav-btn prev" id="lightbox-prev"><i class="fa-solid fa-chevron-left"></i></button>' +
          '<button class="lightbox-nav-btn next" id="lightbox-next"><i class="fa-solid fa-chevron-right"></i></button>'
        : "";
      var mediaHtml = !m
        ? '<div class="work-tile-empty" style="width:100%;height:100%;"><i class="fa-solid fa-cubes"></i></div>'
        : m.type === "sketchfab"
          ? '<iframe src="' + m.url + '" allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen></iframe>'
          : m.type === "video"
            ? '<video src="' + m.url + '" controls autoplay muted></video>'
            : '<img src="' + m.url + '" alt="">';
      frame.innerHTML = navHtml + mediaHtml;
      if (lightboxState.media.length > 1) {
        document.getElementById("lightbox-prev").addEventListener("click", function () { stepLightbox(-1); });
        document.getElementById("lightbox-next").addEventListener("click", function () { stepLightbox(1); });
      }
    }

    function renderLightboxThumbs() {
      var wrap = document.getElementById("lightbox-thumbs");
      if (lightboxState.media.length < 2) { wrap.innerHTML = ""; return; }
      wrap.innerHTML = lightboxState.media.map(function (m, i) {
        var active = i === lightboxState.index ? " active" : "";
        if (m.type === "sketchfab") return '<div class="lightbox-thumb-sketchfab' + active + '" data-idx="' + i + '"><i class="fa-solid fa-cube"></i></div>';
        if (m.type === "video") return '<video class="lightbox-thumb' + active + '" data-idx="' + i + '" src="' + m.url + '" muted></video>';
        return '<img class="lightbox-thumb' + active + '" data-idx="' + i + '" src="' + m.url + '" alt="">';
      }).join("");
      wrap.querySelectorAll("[data-idx]").forEach(function (el) {
        el.addEventListener("click", function () {
          lightboxState.index = parseInt(el.dataset.idx, 10);
          renderLightboxFrame();
          renderLightboxThumbs();
        });
      });
    }

    function renderLightboxSidebar() {
      var w = lightboxState.work;
      var toolsHtml = (w.software || []).length
        ? '<div class="work-tools">' + w.software.map(function (t) { return '<span class="tag" style="margin-right:0;">' + escapeHtml(t) + '</span>'; }).join("") + '</div>'
        : "";
      var adminHtml = isAdmin
        ? '<div class="lightbox-admin-row">' +
            '<button class="btn btn-ghost" id="lb-toggle-pub" style="flex:1;justify-content:center;font-size:.78rem;"><i class="fa-solid ' + (w.published ? "fa-eye-slash" : "fa-eye") + '"></i> ' + (w.published ? "Despublicar" : "Publicar") + '</button>' +
            '<button class="btn btn-danger" id="lb-delete" style="flex:1;justify-content:center;font-size:.78rem;"><i class="fa-solid fa-trash"></i> Excluir</button>' +
          '</div>'
        : "";
      document.getElementById("lightbox-sidebar").innerHTML =
        '<span class="dim" style="font-family:var(--font-mono);">' + new Date(w.created_at).toLocaleDateString("pt-BR") + (w.published ? "" : " · rascunho") + '</span>' +
        '<h2>' + escapeHtml(w.title) + '</h2>' +
        toolsHtml +
        (w.description ? '<p class="lightbox-desc">' + escapeHtml(w.description) + '</p>' : '<p class="lightbox-desc dim">Sem descrição.</p>') +
        adminHtml;
      if (isAdmin) {
        document.getElementById("lb-toggle-pub").addEventListener("click", function () { togglePublished(w.id, w.published); closeLightbox(); });
        document.getElementById("lb-delete").addEventListener("click", function () { deleteWork(w.id); });
      }
    }

    function openModal() {
      pendingFiles = [];
      var root = document.getElementById("modal-root");
      root.innerHTML =
        '<div class="modal-overlay" id="modal-overlay">' +
          '<div class="panel modal-card">' +
            '<h2 style="margin-bottom:16px;"><i class="fa-solid fa-cubes accent"></i> Novo trabalho</h2>' +
            '<form id="work-form">' +
              '<div class="field"><label>Título</label><input type="text" id="w-title" required></div>' +
              '<div class="field"><label>Descrição</label><textarea id="w-desc" rows="3" style="resize:vertical;"></textarea></div>' +
              '<div class="field"><label>Programas usados (separados por vírgula)</label><input type="text" id="w-tools" placeholder="Blender, Photoshop, Substance Painter"></div>' +
              '<div class="field"><label>Embed do Sketchfab (opcional)</label><input type="text" id="w-sketchfab" placeholder="https://sketchfab.com/models/xxxxx/embed"></div>' +
              '<div class="field">' +
                '<label>Imagens / vídeos</label>' +
                '<div class="file-drop" id="file-drop">Clique ou arraste arquivos aqui</div>' +
                '<input type="file" id="file-input" accept="image/*,video/*" multiple class="hidden">' +
                '<div class="file-preview-list" id="file-preview-list"></div>' +
              '</div>' +
              '<label style="display:flex;align-items:center;gap:8px;font-size:.85rem;margin-bottom:16px;"><input type="checkbox" id="w-published" checked style="width:auto;"> Publicar imediatamente</label>' +
              '<div style="display:flex;gap:10px;">' +
                '<button type="button" class="btn btn-ghost" id="modal-cancel" style="flex:1;justify-content:center;">Cancelar</button>' +
                '<button type="submit" class="btn btn-solid" id="modal-submit" style="flex:1;justify-content:center;"><i class="fa-solid fa-floppy-disk"></i> Publicar</button>' +
              '</div>' +
              '<p id="modal-error" class="hidden" style="color:#ff8a8a;font-size:.8rem;margin-top:10px;"></p>' +
            '</form>' +
          '</div>' +
        '</div>';

      document.getElementById("modal-overlay").addEventListener("click", function (e) { if (e.target.id === "modal-overlay") closeModal(); });
      document.getElementById("modal-cancel").addEventListener("click", closeModal);
      document.getElementById("file-drop").addEventListener("click", function () { document.getElementById("file-input").click(); });
      document.getElementById("file-input").addEventListener("change", function (e) {
        pendingFiles = pendingFiles.concat(Array.from(e.target.files));
        renderFilePreview();
      });
      document.getElementById("work-form").addEventListener("submit", submitWork);
    }

    function renderFilePreview() {
      document.getElementById("file-preview-list").innerHTML = pendingFiles.map(function (f) {
        return '<span>' + escapeHtml(f.name) + '</span>';
      }).join("");
    }

    function closeModal() { document.getElementById("modal-root").innerHTML = ""; }

    function submitWork(e) {
      e.preventDefault();
      var submitBtn = document.getElementById("modal-submit");
      var errorEl = document.getElementById("modal-error");
      submitBtn.disabled = true;
      errorEl.classList.add("hidden");

      var title = document.getElementById("w-title").value.trim();
      var description = document.getElementById("w-desc").value.trim();
      var tools = document.getElementById("w-tools").value.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
      var sketchfab = document.getElementById("w-sketchfab").value.trim();
      var published = document.getElementById("w-published").checked;

      window.LunariumAuth.getSession().then(function (session) {
        return window.sb.from("works").insert({
          author_id: session.user.id,
          title: title,
          description: description,
          software: tools,
          sketchfab_embed_url: sketchfab || null,
          published: published
        }).select().single();
      }).then(function (res) {
        if (res.error) throw res.error;
        var workId = res.data.id;
        return Promise.all(pendingFiles.map(function (file, i) {
          var isVideo = file.type.indexOf("video") === 0;
          var ext = file.name.split(".").pop();
          var path = workId + "/" + Date.now() + "-" + i + "." + ext;
          return window.sb.storage.from("work-media").upload(path, file).then(function (upRes) {
            if (upRes.error) throw upRes.error;
            var pub = window.sb.storage.from("work-media").getPublicUrl(path);
            return window.sb.from("work_media").insert({
              work_id: workId,
              media_type: isVideo ? "video" : "image",
              url: pub.data.publicUrl,
              position: i
            });
          });
        }));
      }).then(function () {
        closeModal();
        loadWorks();
      }).catch(function (err) {
        errorEl.textContent = err.message || "algo deu errado ao publicar.";
        errorEl.classList.remove("hidden");
        submitBtn.disabled = false;
      });
    }

    window.LunariumAuth.getProfile().then(function (profile) {
      isAdmin = !!(profile && profile.is_admin);
      if (isAdmin) {
        var btn = document.getElementById("new-work-btn");
        btn.classList.remove("hidden");
        btn.addEventListener("click", openModal);
      }
      loadWorks();
    });
  })();
  </script>
</body>
</html>
