<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cantinho — Lunarium's Lab</title>
<link rel="icon" href="assets/favicon.png">
<script src="js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=VT323&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Space+Mono&family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/base.css">
<style>
  .cantinho-split { display:grid; grid-template-columns: 1.6fr 1fr; gap:20px; align-items:start; }
  @media (max-width: 900px) { .cantinho-split { grid-template-columns:1fr; } }

  .section-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap; }
  .section-head h2 { font-size:1rem; margin:0; }
  .sync-status { font-size:.72rem; color:var(--text-faint); font-family:var(--font-mono); display:flex; align-items:center; gap:8px; }
  .sync-btn {
    font-family: var(--font-mono); font-size:.7rem; padding:.4em .8em; border-radius:999px;
    border:1px solid var(--border); background:var(--surface); color:var(--text-dim); cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  .sync-btn:hover { color:var(--text-strong); border-color:var(--text-dim); }
  .sync-btn.spinning i { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .art-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap:14px; }
  .art-card {
    display:flex; flex-direction:column; border-radius: var(--radius-sm); overflow:hidden;
    border:1px solid var(--border); background:var(--surface); text-decoration:none; color:var(--text);
    transition: transform .15s ease, border-color .15s ease;
  }
  .art-card:hover { transform: translateY(-3px); border-color: hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .5); }
  .art-cover { height:140px; background-size:cover; background-position:center; background-color: var(--surface-strong); }
  .art-cover-empty { display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:1.4rem; }
  .art-body { padding:12px 14px; display:flex; flex-direction:column; gap:2px; }
  .art-body strong { font-size:.88rem; color:var(--text-strong); }

  .mood-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin-top:10px; }
  .mood-item { border-radius: var(--radius-sm); overflow:hidden; border:1px solid var(--border); background:var(--surface); aspect-ratio: 3/4; position:relative; }
  .mood-item img { width:100%; height:100%; object-fit:cover; display:block; }
  .mood-item figcaption { position:absolute; bottom:0; left:0; right:0; padding:6px 8px; font-size:.68rem; background:linear-gradient(transparent, rgba(0,0,0,.65)); color:#fff; }

  .link-card {
    display:flex; align-items:center; gap:12px; padding:14px 16px; text-decoration:none; color:var(--text);
    border-radius: var(--radius-sm); border:1px solid var(--border); background:var(--surface); margin-bottom:10px;
    transition: transform .15s ease, border-color .15s ease;
  }
  .link-card:hover { transform: translateX(4px); border-color: hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .5); }
  .link-card i { width:20px; text-align:center; color: hsl(var(--accent-h) var(--accent-s) var(--accent-l)); }
</style>
</head>
<body data-page="cantinho">
  <div id="app-shell">
    <div id="app-nav"></div>
    <div>
      <header class="topbar" id="app-topbar"></header>
      <main id="app-main">
        <div class="cantinho-split">
          <section>
            <div class="section-head">
              <h2><i class="fa-solid fa-cubes accent"></i> Meus Trabalhos</h2>
              <div class="sync-status">
                <span id="sync-label">—</span>
                <button class="sync-btn" id="sync-btn" type="button"><i class="fa-solid fa-arrows-rotate"></i> Sincronizar</button>
              </div>
            </div>
            <div id="art-grid" class="art-grid"></div>

            <div id="mood-extra" class="hidden" style="margin-top:26px;">
              <div class="section-head"><h2 style="font-size:.92rem;"><i class="fa-solid fa-images accent"></i> Outras referências</h2></div>
              <div id="mood-grid" class="mood-grid"></div>
            </div>
          </section>

          <section>
            <div class="panel" style="padding:18px;">
              <h2 style="font-size:.95rem;margin:0 0 12px 0;"><i class="fa-solid fa-link accent"></i> Minhas redes sociais</h2>
              <div id="links-list"></div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <div id="theme-panel-root"></div>

  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="data/cantinho.js"></script>
  <script src="js/artstation.js"></script>
  <script>
    (function () {
      function escapeHtml(str) { var d = document.createElement("div"); d.textContent = str || ""; return d.innerHTML; }

      // links rápidos
      var links = window.LUNARIUM_CANTINHO_LINKS || [];
      document.getElementById("links-list").innerHTML = links.map(function (l) {
        return '<a class="link-card" href="' + l.url + '" target="_blank" rel="noopener"><i class="' + l.icon + '"></i>' + escapeHtml(l.label) + '</a>';
      }).join("") || '<p class="dim" style="font-size:.82rem;">Nenhum link cadastrado ainda.</p>';

      // referências manuais extra (opcional, além do ArtStation)
      var mood = window.LUNARIUM_MOODBOARD || [];
      if (mood.length) {
        document.getElementById("mood-extra").classList.remove("hidden");
        document.getElementById("mood-grid").innerHTML = mood.map(function (m) {
          return '<figure class="mood-item"><img src="' + m.url + '" alt="' + escapeHtml(m.caption || "") + '" loading="lazy">' +
            (m.caption ? '<figcaption>' + escapeHtml(m.caption) + '</figcaption>' : '') + '</figure>';
        }).join("");
      }

      // sincronização com o ArtStation
      var artGrid = document.getElementById("art-grid");
      var syncLabel = document.getElementById("sync-label");
      var syncBtn = document.getElementById("sync-btn");
      var username = window.LUNARIUM_ARTSTATION_USERNAME;
      var manualWorks = (window.LUNARIUM_ARTWORKS || []).map(function (w) {
        return {
          id: "manual-" + w.title,
          title: w.title,
          url: w.url || "#",
          cover: w.cover || "",
          date: w.date || null,
          likes: 0,
          description: w.description || "",
          tools: w.tools || []
        };
      });

      function renderArt(synced) {
        var all = manualWorks.concat(synced || []);
        if (!all.length) {
          artGrid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="orbit"></div><h3>Nenhum trabalho ainda</h3><p class="dim">Preencha <code>LUNARIUM_ARTWORKS</code> em <code>data/cantinho.js</code> (garantido) ou configure o usuário do ArtStation pra sincronização automática.</p></div>';
          return;
        }
        artGrid.innerHTML = all.map(window.LunariumArtstation.renderCard).join("");
      }

      function sync(force) {
        if (!username) {
          renderArt([]);
          syncLabel.textContent = manualWorks.length ? "só trabalhos manuais" : "ArtStation não configurado";
          return;
        }
        syncBtn.classList.add("spinning");
        syncLabel.textContent = "sincronizando…";
        window.LunariumArtstation.fetchProjects(username, force).then(function (res) {
          renderArt(res.projects);
          syncLabel.textContent = (res.fromCache ? "sincronizado " : "atualizado ") + window.LunariumArtstation.timeAgo(res.fetchedAt);
        }).catch(function () {
          renderArt([]);
          syncLabel.textContent = "sincronização falhou" + (manualWorks.length ? " · mostrando manuais" : "");
        }).then(function () { syncBtn.classList.remove("spinning"); });
      }

      syncBtn.addEventListener("click", function () { sync(true); });
      renderArt([]);
      sync(false);
    })();
  </script>
</body>
</html>
