<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — Lunarium's Lab</title>
<link rel="icon" href="assets/favicon.png">
<script src="js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=VT323&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Space+Mono&family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/base.css">
<style>
  .chat-layout { display:grid; grid-template-columns: 270px 1fr; gap:16px; height: calc(100vh - 150px); min-height:460px; }
  @media (max-width: 800px) { .chat-layout { grid-template-columns: 1fr; height:auto; } }

  .chat-contacts { display:flex; flex-direction:column; overflow:hidden; }
  .me-card { display:flex; align-items:center; gap:10px; padding:16px; border-bottom:1px solid var(--border); }
  .avatar-badge {
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .2); font-size:.85rem; flex-shrink:0; overflow:hidden;
  }
  .avatar-badge img { width:100%; height:100%; object-fit:cover; }
  .me-card strong { display:block; font-size:.88rem; }
  .me-card .code-pill {
    font-family:var(--font-mono); font-size:.68rem; color:var(--text-dim); cursor:pointer;
    display:flex; align-items:center; gap:5px;
  }
  .add-contact { padding:12px 14px; border-bottom:1px solid var(--border); display:flex; gap:6px; }
  .add-contact input { font-size:.78rem; padding:.55em .7em; }
  .contact-list { overflow-y:auto; flex:1; }
  .contact-item {
    display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer;
    border-left:3px solid transparent; transition: background .15s ease;
  }
  .contact-item:hover { background: var(--surface); }
  .contact-item.active { background: hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .12); border-left-color: hsl(var(--accent-h) var(--accent-s) var(--accent-l)); }
  .contact-item strong { font-size:.85rem; display:block; }
  .contact-item small { color:var(--text-dim); font-size:.72rem; }

  .chat-main { display:flex; flex-direction:column; overflow:hidden; }
  .chat-head { display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--border); }
  .chat-head strong { font-size:.92rem; }
  .chat-head small { color:var(--text-dim); font-size:.75rem; }
  .chat-messages { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:70%; padding:.6em .9em; border-radius: var(--radius-sm); font-size:.86rem; line-height:1.4; }
  .msg.me { align-self:flex-end; background: hsl(var(--accent-h) var(--accent-s) var(--accent-l)); color: var(--on-accent); border-bottom-right-radius:2px; }
  .msg.them { align-self:flex-start; background: var(--surface); border:1px solid var(--border); border-bottom-left-radius:2px; }
  .msg time { display:block; font-size:.62rem; opacity:.7; margin-top:4px; }
  .msg img, .msg video { max-width:100%; max-height:260px; border-radius:8px; display:block; margin-bottom:4px; }

  .chat-settings-menu {
    position:absolute; top:100%; right:16px; margin-top:6px; z-index:20;
    background: var(--surface-strong); border:1px solid var(--border); border-radius: var(--radius-sm);
    box-shadow: var(--shadow); display:flex; flex-direction:column; min-width:190px; overflow:hidden;
  }
  .chat-settings-menu button {
    display:flex; align-items:center; gap:10px; padding:10px 14px; background:none; border:none;
    color:var(--text); font-size:.82rem; cursor:pointer; text-align:left; font-family:var(--font-body);
  }
  .chat-settings-menu button:hover { background:var(--surface); }
  .chat-settings-menu button.danger { color:#ff8a8a; }

  .attach-preview {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 18px; font-size:.78rem; color:var(--text-dim); border-top:1px solid var(--border); background:var(--surface);
  }
  .attach-preview button { background:none; border:none; color:var(--text-dim); cursor:pointer; }

  .chat-inputrow { display:flex; align-items:center; gap:8px; padding:14px 18px; border-top:1px solid var(--border); }
  .chat-inputrow input { flex:1; }
</style>
</head>
<body data-page="chat">
  <div id="app-shell">
    <div id="app-nav"></div>
    <div>
      <header class="topbar" id="app-topbar"></header>
      <main id="app-main">
        <div class="chat-layout">
          <aside class="panel chat-contacts">
            <div class="me-card">
              <span class="avatar-badge" id="me-avatar">?</span>
              <div>
                <strong id="me-name">—</strong>
                <span class="code-pill" id="me-code" title="Clique para copiar"><i class="fa-regular fa-copy"></i> —</span>
              </div>
            </div>
            <form class="add-contact" id="add-contact-form">
              <input type="text" id="add-contact-input" placeholder="Código do contato" autocomplete="off">
              <button class="btn-icon btn-solid" type="submit" aria-label="Adicionar"><i class="fa-solid fa-plus"></i></button>
            </form>
            <div class="contact-list" id="contact-list"><p class="dim" style="padding:16px;font-size:.8rem;">Carregando…</p></div>
          </aside>

          <section class="panel chat-main">
            <div id="chat-empty" class="empty-state" style="margin:auto;">
              <div class="orbit"></div>
              <h3>Escolha uma conversa</h3>
              <p class="dim">Ou adicione alguém pelo código ao lado.</p>
            </div>
            <div id="chat-active" class="hidden" style="display:contents;">
              <div class="chat-head" style="position:relative;">
                <span class="avatar-badge" id="active-avatar"></span>
                <div>
                  <strong id="active-name"></strong><br>
                  <small id="active-sub"></small>
                </div>
                <button class="btn-icon btn-ghost" id="chat-settings-btn" style="margin-left:auto;" aria-label="Configurações da conversa"><i class="fa-solid fa-gear"></i></button>
                <div class="chat-settings-menu hidden" id="chat-settings-menu">
                  <button type="button" id="clear-history-btn"><i class="fa-solid fa-broom"></i> Limpar histórico</button>
                  <button type="button" id="remove-contact-btn" class="danger"><i class="fa-solid fa-user-slash"></i> Remover contato</button>
                </div>
              </div>
              <div class="chat-messages" id="chat-messages"></div>
              <div class="attach-preview hidden" id="attach-preview">
                <span id="attach-preview-name"></span>
                <button type="button" id="attach-cancel" aria-label="Cancelar anexo"><i class="fa-solid fa-xmark"></i></button>
              </div>
              <form class="chat-inputrow" id="send-form">
                <input type="file" id="attach-input" accept="image/*,video/*" class="hidden">
                <button type="button" class="btn-icon btn-ghost" id="attach-btn" aria-label="Anexar mídia"><i class="fa-solid fa-paperclip"></i></button>
                <input type="text" id="send-input" placeholder="Escreva uma mensagem…" autocomplete="off">
                <button class="btn btn-solid btn-icon" type="submit" aria-label="Enviar"><i class="fa-solid fa-paper-plane"></i></button>
              </form>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <div id="theme-panel-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script>
  (function () {
    var me = null;
    var contacts = []; // { id, username, display_name, avatar_url, chat_code }
    var activeId = null;

    function escapeHtml(str) { var d = document.createElement("div"); d.textContent = str || ""; return d.innerHTML; }
    function fmtTime(iso) { return new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }
    function displayNameOf(p) { return (p.display_name || p.username); }
    function avatarHtml(p) {
      return p.avatar_url ? '<img src="' + p.avatar_url + '" alt="">' : displayNameOf(p).slice(0, 2).toUpperCase();
    }

    function renderMe() {
      document.getElementById("me-avatar").innerHTML = avatarHtml(me);
      document.getElementById("me-name").textContent = displayNameOf(me);
      document.getElementById("me-code").innerHTML = '<i class="fa-regular fa-copy"></i> ' + me.chat_code;
    }

    function renderContacts() {
      var list = document.getElementById("contact-list");
      if (!contacts.length) {
        list.innerHTML = '<p class="dim" style="padding:16px;font-size:.8rem;">Nenhum contato ainda. Adicione pelo código acima.</p>';
        return;
      }
      list.innerHTML = contacts.map(function (c) {
        return (
          '<div class="contact-item' + (c.id === activeId ? ' active' : '') + '" data-id="' + c.id + '">' +
            '<span class="avatar-badge">' + avatarHtml(c) + '</span>' +
            '<div><strong>' + escapeHtml(displayNameOf(c)) + '</strong><small>' + c.chat_code + '</small></div>' +
          '</div>'
        );
      }).join("");
      list.querySelectorAll(".contact-item").forEach(function (el) {
        el.addEventListener("click", function () { openThread(el.dataset.id); });
      });
    }

    function loadContacts() {
      return window.sb.from("chat_contacts")
        .select("contact_id, profiles!chat_contacts_contact_id_fkey(id, username, display_name, avatar_url, chat_code)")
        .eq("owner_id", me.id)
        .then(function (res) {
          if (res.error) throw res.error;
          var added = (res.data || []).map(function (row) { return row.profiles; }).filter(Boolean);

          // + quem já te mandou mensagem, mesmo que você não tenha adicionado ainda
          return window.sb.from("chat_messages")
            .select("sender_id, profiles!chat_messages_sender_id_fkey(id, username, display_name, avatar_url, chat_code)")
            .eq("receiver_id", me.id)
            .then(function (res2) {
              if (res2.error) throw res2.error;
              var fromMessages = (res2.data || []).map(function (row) { return row.profiles; }).filter(Boolean);
              var byId = {};
              added.concat(fromMessages).forEach(function (p) { if (p) byId[p.id] = p; });
              contacts = Object.keys(byId).map(function (k) { return byId[k]; });
              renderContacts();
            });
        });
    }

    function renderMessages(rows) {
      var box = document.getElementById("chat-messages");
      if (!rows.length) {
        box.innerHTML = '<p class="dim" style="margin:auto;font-size:.82rem;">Nenhuma mensagem ainda. Diga oi!</p>';
        return;
      }
      box.innerHTML = rows.map(function (m) {
        var mine = m.sender_id === me.id;
        var mediaHtml = "";
        if (m.media_url) {
          mediaHtml = m.media_type === "video"
            ? '<video src="' + m.media_url + '" controls></video>'
            : '<img src="' + m.media_url + '" alt="">';
        }
        return '<div class="msg ' + (mine ? "me" : "them") + '">' + mediaHtml + (m.content ? escapeHtml(m.content) : "") + '<time>' + fmtTime(m.created_at) + '</time></div>';
      }).join("");
      box.scrollTop = box.scrollHeight;
    }

    function loadMessages(contactId) {
      return window.sb.from("chat_messages")
        .select("*")
        .or("and(sender_id.eq." + me.id + ",receiver_id.eq." + contactId + "),and(sender_id.eq." + contactId + ",receiver_id.eq." + me.id + ")")
        .order("created_at", { ascending: true })
        .then(function (res) {
          if (res.error) throw res.error;
          renderMessages(res.data || []);
        });
    }

    function openThread(contactId) {
      activeId = contactId;
      var contact = contacts.filter(function (c) { return c.id === contactId; })[0];
      if (!contact) return;
      document.getElementById("chat-empty").classList.add("hidden");
      document.getElementById("chat-active").classList.remove("hidden");
      document.getElementById("active-avatar").innerHTML = avatarHtml(contact);
      document.getElementById("active-name").textContent = displayNameOf(contact);
      document.getElementById("active-sub").textContent = contact.chat_code;
      renderContacts();
      loadMessages(contactId);
      document.getElementById("send-input").focus();
    }

    document.getElementById("add-contact-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var input = document.getElementById("add-contact-input");
      var code = input.value.trim().toUpperCase();
      if (!code) return;
      if (code === me.chat_code) { alert("esse é o seu próprio código."); return; }

      window.sb.from("profiles").select("*").eq("chat_code", code).single().then(function (res) {
        if (res.error || !res.data) throw new Error("código não encontrado.");
        var target = res.data;
        return window.sb.from("chat_contacts").insert({ owner_id: me.id, contact_id: target.id }).then(function (insRes) {
          if (insRes.error && insRes.error.code !== "23505") throw insRes.error; // 23505 = já existe, ignora
          input.value = "";
          return loadContacts().then(function () { openThread(target.id); });
        });
      }).catch(function (err) {
        alert(err.message || "não deu pra adicionar esse contato.");
      });
    });

    var pendingAttachment = null;

    document.getElementById("attach-btn").addEventListener("click", function () {
      document.getElementById("attach-input").click();
    });
    document.getElementById("attach-input").addEventListener("change", function (e) {
      var file = e.target.files[0];
      if (!file) return;
      if (file.size > 15 * 1024 * 1024) { alert("Arquivo maior que 15MB."); e.target.value = ""; return; }
      pendingAttachment = file;
      document.getElementById("attach-preview-name").textContent = "📎 " + file.name;
      document.getElementById("attach-preview").classList.remove("hidden");
    });
    document.getElementById("attach-cancel").addEventListener("click", function () {
      pendingAttachment = null;
      document.getElementById("attach-input").value = "";
      document.getElementById("attach-preview").classList.add("hidden");
    });

    document.getElementById("send-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var input = document.getElementById("send-input");
      var text = input.value.trim();
      if (!activeId || (!text && !pendingAttachment)) return;

      var payload = { sender_id: me.id, receiver_id: activeId, content: text || null };
      var attachment = pendingAttachment;
      input.value = "";
      pendingAttachment = null;
      document.getElementById("attach-input").value = "";
      document.getElementById("attach-preview").classList.add("hidden");

      var upload = Promise.resolve();
      if (attachment) {
        var isVideo = attachment.type.indexOf("video") === 0;
        var ext = attachment.name.split(".").pop();
        var path = me.id + "/" + Date.now() + "." + ext;
        upload = window.sb.storage.from("chat-media").upload(path, attachment).then(function (upRes) {
          if (upRes.error) throw upRes.error;
          var pub = window.sb.storage.from("chat-media").getPublicUrl(path);
          payload.media_url = pub.data.publicUrl;
          payload.media_type = isVideo ? "video" : "image";
        });
      }

      upload.then(function () {
        return window.sb.from("chat_messages").insert(payload);
      }).then(function (res) {
        if (res && res.error) throw res.error;
        loadMessages(activeId);
      }).catch(function (err) {
        alert("não deu pra enviar: " + (err.message || err));
      });
    });

    document.getElementById("chat-settings-btn").addEventListener("click", function (e) {
      e.stopPropagation();
      document.getElementById("chat-settings-menu").classList.toggle("hidden");
    });
    document.addEventListener("click", function () {
      document.getElementById("chat-settings-menu").classList.add("hidden");
    });

    document.getElementById("clear-history-btn").addEventListener("click", function () {
      if (!activeId) return;
      if (!confirm("Apagar todo o histórico dessa conversa? Isso remove as mensagens dos dois lados e não pode ser desfeito.")) return;
      window.sb.from("chat_messages").delete()
        .or("and(sender_id.eq." + me.id + ",receiver_id.eq." + activeId + "),and(sender_id.eq." + activeId + ",receiver_id.eq." + me.id + ")")
        .then(function (res) {
          if (res.error) { alert("não deu pra apagar: " + res.error.message); return; }
          loadMessages(activeId);
        });
    });

    document.getElementById("remove-contact-btn").addEventListener("click", function () {
      if (!activeId) return;
      if (!confirm("Remover este contato da sua lista?")) return;
      window.sb.from("chat_contacts").delete().eq("owner_id", me.id).eq("contact_id", activeId).then(function () {
        activeId = null;
        document.getElementById("chat-active").classList.add("hidden");
        document.getElementById("chat-empty").classList.remove("hidden");
        loadContacts();
      });
    });

    document.getElementById("me-code").addEventListener("click", function () {
      navigator.clipboard && navigator.clipboard.writeText(me.chat_code);
      var el = document.getElementById("me-code");
      var old = el.innerHTML;
      el.innerHTML = '<i class="fa-solid fa-check"></i> copiado!';
      setTimeout(function () { el.innerHTML = old; }, 1200);
    });

    window.LunariumAuth.getProfile().then(function (profile) {
      if (!profile) return;
      me = profile;
      renderMe();
      loadContacts();

      // mensagens em tempo real
      window.sb.channel("chat-" + me.id)
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "chat_messages", filter: "receiver_id=eq." + me.id }, function (payload) {
          var msg = payload.new;
          if (msg.sender_id === activeId) {
            loadMessages(activeId);
          } else {
            loadContacts(); // pra aparecer na lista mesmo sem ter adicionado ainda
          }
        })
        .subscribe();
    });
  })();
  </script>
</body>
</html>
